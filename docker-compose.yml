# 业务容器编排：exporter + 可选 collector。
#
# 监控告警栈（Prometheus / Grafana / Alertmanager）全部由目标 k3s 集群的
# Rancher Monitoring 提供，不在此 compose 中部署：
#   - Rancher 按 DEPLOY.md 第 5 节配 Additional Scrape Configs 抓 <TARGET_HOST>:9105
#   - 按第 6 节导入 Dashboard 到 Rancher Grafana
#   - 告警规则/路由录入 Rancher 内置 Prometheus / Alertmanager（见第 6.1、6.2 节），
#     通知走 Alertmanager 原生 receiver（email / webhook），无自建通知服务
#
# 服务清单：
#   exporter   — 接收 Jenkins 构建推送 + 文件管道，暴露 /metrics（默认启动）
#   collector  — 定时从 Jenkins 采集并 POST 给 exporter（profile: collector，需 .env 凭据）
#
# 使用：
#   1. cp .env.example .env，填入 JENKINS_USERNAME / JENKINS_API_TOKEN
#   2. docker compose up -d                          # 只起 exporter
#   3. docker compose --profile collector up -d      # 加 collector
#   4. Grafana / Prometheus / Alertmanager 走 Rancher（见 DEPLOY.md 第 5、6 节）

services:
  exporter:
    build:
      context: .
      dockerfile: Dockerfile.exporter
    image: ops-exporter:local
    container_name: ops-exporter
    ports:
      - "9105:9105"
    volumes:
      # config.docker.json 含 http 超时与数据过期配置；改配置后重建或 restart 挂载
      - ./config.docker.json:/app/config.json:ro
      # 文件管道数据源：直接读宿主机 /data/log 下的 .json 任务结果（只读，exporter 不写结果文件）
      - /data/log:/data/log:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9105/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - monitoring

  collector:
    build:
      context: .
      dockerfile: Dockerfile.collector
    image: jenkins-collector:local
    container_name: jenkins-collector
    # 认证不进镜像/不硬编码：运行时由 .env 注入（见 config.go 的 EnvJenkins*）
    environment:
      JENKINS_USERNAME: ${JENKINS_USERNAME:-}
      JENKINS_API_TOKEN: ${JENKINS_API_TOKEN:-}
    volumes:
      # 使用前先编辑 config.collector.docker.json 填真实 jenkins_url / jobs（认证走 .env）
      - ./config.collector.docker.json:/app/config.json:ro
      # 断点状态挂到宿主机卷：容器重建后不重复推送已处理 Build（Task 5 断点续传）
      - collector-state:/app/data
    depends_on:
      exporter:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - monitoring
    profiles:
      - collector # 默认不起；docker compose --profile collector up -d 或显式指定服务名启动

volumes:
  collector-state:

networks:
  monitoring:
    driver: bridge
