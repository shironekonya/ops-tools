# Grafana Dashboard 自动加载：从 /var/lib/grafana/dashboards 目录读取 JSON。
apiVersion: 1

providers:
  - name: ops-exporter
    orgId: 1
    folder: Ops
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
