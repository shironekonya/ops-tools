# Prometheus 抓取配置（docker-compose 部署）。
# 抓取 exporter 的 /metrics，15s 一次；同一 registry 同时暴露 ops_job_* 与 jenkins_build_*。
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: ops-exporter
    static_configs:
      - targets: ["exporter:9105"]
    metrics_path: /metrics
    scrape_timeout: 10s
